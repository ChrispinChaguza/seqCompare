[build-system]
requires = ["setuptools"]

[project]
name = "seqCompare"
dynamic = ["version"]
authors = [
  { name="Chrispin Chaguza", email="chrispin.chaguza@gmail.com" },
]

maintainers = [
  {name = "Chrispin Chaguza", email = "chrispin.chaguza@gmail.com"},
]

description = "seqCompare: A toolkit for sequence similarity analysis"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

keywords = ["Sequence similarity","K-mer","Cluster","Genome"]
dependencies = [
    "build"
]

[tool.setuptools.dynamic]
version = {attr = "seqCompare.__version__"}

[tool.setuptools.packages]
find = {} 

[tool.setuptools]
py-modules = ["seqCompare.seqCompare"]

[project.scripts]
seqCompare = "seqCompare.__main__:main"

[project.urls]
Homepage = "https://github.com/ChrispinChaguza/seqCompare"
Repository = "https://github.com/ChrispinChaguza/seqCompare.git"
Issues = "https://github.com/ChrispinChaguza/seqCompare/issues"
Documentation = "https://github.com/ChrispinChaguza/seqCompare"
Website = "https://github.com/ChrispinChaguza/seqCompare"

